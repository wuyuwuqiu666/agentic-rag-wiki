[project]
name = "agentic-rag-wiki"
version = "0.0.1"
description = "Agentic RAG + LLM Wiki 企业知识库（执行档=单机缩量，PRD v0.7.1）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]
# 生产实现档（M1+ 按需启用；端口已就位，见 PRD G5/§6 禁令 3）
milvus = ["pymilvus>=2.4"]
postgres = ["psycopg[binary]>=3.1"]
local-model = ["torch>=2.11", "sentence-transformers>=2.7"]  # ADR-004/005：Blackwell 须 CUDA 12.8+ 构建
orchestration = ["langgraph>=1.2"]  # ADR-001 企业档编排（放行项⑮）：单机执行档默认 plain 不装；langgraph 仅 import 于 orchestration_langgraph.py（§6 禁令3）
s3 = ["boto3>=1.34"]  # 放行项⑯ 对象库企业档（Apache-2.0）：默认 filesystem 不装；boto3 仅 import 于 objectstore_s3.py
kafka = ["confluent-kafka>=2.0"]  # 放行项⑯ 队列企业档（Apache-2.0）：默认 pg_queue 不装；confluent_kafka 仅 import 于 mq_kafka.py
http = ["fastapi>=0.115", "uvicorn>=0.30"]  # §5 gateway HTTP 门面/演示前端接线（MIT）：非单机核心依赖，仅 gateway/http.py 入口用；不进 deps_governance 核心 3 项
documents = ["pypdf>=4.0"]  # 放行项：文件摄取 .pdf 文本层解析（MIT），仅 providers/fileparser_dev.py import（在 sdk_blacklist 强制）；docx/pptx/txt/md 走 stdlib 无需此项；不进核心 3 项。扫描版 PDF 的图像页改由下方 `ocr` 档识别（M4-cf，放行项⑦）
ocr = ["rapidocr-onnxruntime>=1.2", "pypdfium2>=5.0"]  # 放行项⑦ 扫描版 PDF 真 OCR（M4-cf）：Apache-2.0 + BSD-3-Clause，权重随 wheel 分发＝识别零外呼、纯 CPU；仅 providers/scan_ocr_rapid.py import（tests 侧 AST 锁执法），缺装即 ScanOcrUnavailable→失败页如实记账不冒充。排除 PyMuPDF（AGPL，在 deps_governance 拒绝表）

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["src"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "src/platform/breaker"]
addopts = "-q"

# E7 覆盖率门禁：CI 用 --cov 生成 coverage.json，交由 harness.coverage_gate 分档判定（90/70）。
[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = false
skip_covered = false
